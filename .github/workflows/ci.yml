name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: 前端构建（tsc + vite build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 生产构建
        run: npm run build

  backend-smoke:
    name: 后端冒烟（启动 + 健康检查 + 登录）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 启动后端并验证
        run: |
          # ALLOW_LOCAL_TEST=1：e2e 需对本机 mock 上游（127.0.0.1）做连通性测试；生产部署不要开启
          ALLOW_LOCAL_TEST=1 node server/index.js &
          echo $! > server.pid
          for i in $(seq 1 20); do
            curl -sf http://localhost:3100/healthz && break
            sleep 0.5
          done
          # 未登录访问管理接口应返回 401
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100/admin/state)
          [ "$code" = "401" ] || { echo "期望 401，实际 $code"; exit 1; }
          # 默认管理员登录应成功
          token=$(curl -s -X POST http://localhost:3100/admin/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Admin@123"}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).token))")
          [ -n "$token" ] || { echo "登录失败"; exit 1; }
          # 初始密码状态下管理接口应被服务端阻断（403，错误码 40310）
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $token" http://localhost:3100/admin/state)
          [ "$code" = "403" ] || { echo "初始密码状态期望 403，实际 $code"; exit 1; }
          # 完成强制改密后重新登录
          curl -sf -X POST http://localhost:3100/admin/auth/password \
            -H "Content-Type: application/json" -H "Authorization: Bearer $token" \
            -d '{"oldPassword":"Admin@123","newPassword":"Ci!Smoke#2026"}' > /dev/null || { echo "强制改密失败"; exit 1; }
          token=$(curl -s -X POST http://localhost:3100/admin/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"Ci!Smoke#2026"}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).token))")
          [ -n "$token" ] || { echo "改密后登录失败"; exit 1; }
          # 带令牌访问应返回 200
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $token" http://localhost:3100/admin/state)
          [ "$code" = "200" ] || { echo "期望 200，实际 $code"; exit 1; }
          echo "后端冒烟测试通过"

      - name: 端到端回归（注册→发布→授权→网关调用→安全管控）
        run: E2E_ADMIN_PASSWORD='Ci!Smoke#2026' node scripts/e2e.mjs

      - name: 关闭后端
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true

  frontend-ui:
    name: 前端 UI 冒烟（Playwright：登录 → 控制台渲染）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 启动后端（托管 dist）
        run: |
          node server/index.js &
          echo $! > server.pid
          for i in $(seq 1 20); do
            curl -sf http://localhost:3100/healthz && break
            sleep 0.5
          done

      - name: Playwright UI 冒烟
        run: npx playwright test

      - name: 关闭后端
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true
